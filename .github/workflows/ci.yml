name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: vet + gofmt + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: generated file is up to date
        run: go generate ./... && git diff --exit-code
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test -race -cover ./...
      - name: vet 32-bit
        run: GOOS=linux GOARCH=386 go vet ./...

  # ---- The paths the default job does not run ---------------------------
  purego:
    name: purego (portable code on every architecture)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: go vet -tags purego ./...
      - run: go test -race -tags purego ./...

  # s390x is big-endian: it runs load_other.go (explicit word decoding) and
  # must give the digests of the little-endian targets.
  emulated:
    name: emulated s390x (big-endian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all
      - name: cross-compile the test binary
        env:
          GOOS: linux
          GOARCH: s390x
          CGO_ENABLED: "0"
        run: go test -c -o edonr.test .
      - name: run it under QEMU
        run: docker run --rm --platform linux/s390x -v "$PWD:/src:ro" -w /src debian:trixie /src/edonr.test -test.v

  # The AVX-512 kernel needs a runner that has AVX-512 (GitHub's x86 runners
  # vary). When the runner has it, the job is BLOCKING and EDONR_REQUIRE_LANES=8
  # makes the test fail rather than skip, every lane compared with the scalar
  # path. When it lacks it the AVX-512 step is skipped, loudly (a warning
  # annotation and a line in the log), and only the AVX2 width is required.
  # Intel SDE would make it run everywhere: see the tracker.
  avx512:
    name: AVX-512 and AVX2 kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: CPU
        id: cpu
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if grep -q -m1 -w avx512f /proc/cpuinfo; then
            echo "require=8" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=AVX-512 kernel NOT tested::this runner has no avx512f; only AVX2 is exercised"
            echo "SKIPPED: no avx512f on this runner, the AVX-512 kernel was not run"
            echo "require=4" >> "$GITHUB_OUTPUT"
          fi
      - name: forced-dispatch tests of every lane width
        run: EDONR_REQUIRE_LANES=${{ steps.cpu.outputs.require }} go test -count=1 -v -run 'LaneWidths|Lanes|SumN' .
