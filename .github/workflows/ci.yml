name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: vet + gofmt + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: generated file is up to date
        run: go generate ./... && git diff --exit-code
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test -race -cover ./...
      - name: vet 32-bit
        run: GOOS=linux GOARCH=386 go vet ./...

  # ---- The paths the default job does not run ---------------------------
  purego:
    name: purego (portable code on every architecture)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: go vet -tags purego ./...
      - run: go test -race -tags purego ./...

  # s390x is big-endian: it runs load_other.go (explicit word decoding) and
  # must give the digests of the little-endian targets.
  emulated:
    name: emulated s390x (big-endian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all
      - name: cross-compile the test binary
        env:
          GOOS: linux
          GOARCH: s390x
          CGO_ENABLED: "0"
        run: go test -c -o edonr.test .
      - name: run it under QEMU
        run: docker run --rm --platform linux/s390x -v "$PWD:/src:ro" -w /src debian:trixie /src/edonr.test -test.v

  # The AVX-512 kernel needs a runner that has AVX-512 (GitHub's x86 runners
  # vary); EDONR_REQUIRE_LANES=8 makes the test fail rather than skip when the
  # CPU lacks it, so a green job means the kernel ran, every lane compared with
  # the scalar path. The job reports a runner without AVX-512 as a failure
  # of the precondition, not as a pass.
  avx512:
    name: AVX-512 and AVX2 kernels
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: CPU
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 -o 'avx512f' /proc/cpuinfo || echo "no avx512f on this runner"
      - name: forced-dispatch tests of every lane width
        run: EDONR_REQUIRE_LANES=8 go test -count=1 -v -run 'LaneWidths|Lanes|SumN' .
